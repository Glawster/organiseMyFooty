[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organiseMyFooty"
version = "0.1.0"
description = "Export WhatsApp poll attendance reports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "playwright",
]

[project.scripts]
organiseMyFooty = "organiseMyFooty.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["attendanceConfig", "socialMediaSummary", "whatsappAttendance"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["whatsapp*", "organiseMyFooty*"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
